plugins {
    id 'java'
}
repositories {
    mavenLocal()
    maven { url = 'https://repo.runelite.net'; content { includeGroupByRegex('net\\.runelite.*') } }
    mavenCentral()
}
def runeLiteVersion = 'latest.release'
dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
}
group = 'com.presetmanager'
version = '1.0.0'
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release.set(17) }

// Development-only launcher: run with 'gradle runDev' to load this plugin in RuneLite.
sourceSets {
    main { resources { srcDir '.'; include 'runelite-plugin.properties' } }
}
tasks.register('runDev', JavaExec) {
    group = 'application'
    description = 'Launch RuneLite with Preset Manager loaded for development'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.presetmanager.PresetManagerDevelopmentLauncher'
    enableAssertions = true
    workingDir = project.projectDir
}
